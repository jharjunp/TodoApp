# fly.toml app configuration file generated for kwh-server on 2023-09-28T18:10:24+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "kwh-server"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  internal_port = 5432 # Postgres instance
  protocol = "tcp"

[[services.ports]]
  handlers = ["pg_tls"]
  port = 5432
